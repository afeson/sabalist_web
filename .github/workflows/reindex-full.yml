name: Reindex search (full, long timeout)

# Full Typesense reindex of the entire catalogue (~2.4M+). The per-import reindex
# steps use a 40-min cap that the grown catalogue now exceeds (~34k/min → ~70min),
# so this dedicated job carries a long timeout and is run once after all imports.
on:
  push:
    branches: [reindex-full]
  workflow_dispatch:

concurrency:
  group: reindex-search
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install ingestion deps
        working-directory: ingestion
        run: npm install --no-audit --no-fund
      - name: Reindex
        working-directory: ingestion
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TYPESENSE_URL: ${{ secrets.TYPESENSE_URL }}
          TYPESENSE_ADMIN_KEY: ${{ secrets.TYPESENSE_ADMIN_KEY }}
        run: node reindex-search.js
